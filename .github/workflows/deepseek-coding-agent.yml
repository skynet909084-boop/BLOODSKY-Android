name: BLOODSKY DeepSeek coding agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  opencode:
    # Only the repository owner can start a run, and only from an issue (not a PR).
    # This keeps untrusted outside comments from receiving a runner with API credentials.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout BLOODSKY
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check API secret exists
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.API }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Repository Actions secret DEEPSEEK_API_KEY is missing."
            echo "Add it in Settings > Secrets and variables > Actions, then rerun."
            exit 1
          fi

      - name: Run OpenCode with DeepSeek
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.API }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
          share: false

name: BLOODSKY archive inspector tests

on:
  push:
    branches: [main]
    paths:
      - "tools/project_archive_inspector.py"
      - "tools/test_project_archive_inspector.py"
      - ".github/workflows/archive-inspector-tests.yml"
  pull_request:
    paths:
      - "tools/project_archive_inspector.py"
      - "tools/test_project_archive_inspector.py"
      - ".github/workflows/archive-inspector-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run archive inspector unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

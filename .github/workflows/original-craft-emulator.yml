name: Original Craft 1.0.7 emulator probe

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/original-craft-emulator.yml'
      - 'tools/original_craft_emulator_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: original-craft-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned full Craft 1.0.7 decompilation
        uses: actions/download-artifact@v4
        with:
          name: BLOODSKY-Kaskada-decompiled
          run-id: 38600957172
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/craft-decompiled
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install matching Apktool and Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar --version
      - name: Rebuild original APK
        run: |
          java -jar /tmp/apktool.jar b build/craft-decompiled/apktool --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt2" -o build/KaScada-Craft-1.0.7-unsigned.apk
          keytool -genkeypair -keystore /tmp/craft-debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/craft-debug.keystore --ks-pass pass:android --key-pass pass:android --out build/KaScada-Craft-1.0.7.apk build/KaScada-Craft-1.0.7-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/KaScada-Craft-1.0.7.apk
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and traverse original UI offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p build-reports/original-craft-1.0.7
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb install -r build/KaScada-Craft-1.0.7.apk
            python tools/original_craft_emulator_audit.py build-reports/original-craft-1.0.7
      - name: Upload rebuilt APK and full UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Original-Craft-1.0.7-emulator-probe
          path: |
            build/KaScada-Craft-1.0.7.apk
            build-reports/original-craft-1.0.7/
          if-no-files-found: warn
          retention-days: 7

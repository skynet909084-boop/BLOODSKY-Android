name: Original Craft 1.0.7 emulator probe

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/original-craft-emulator.yml'
      - 'tools/original_craft_emulator_probe.py'
      - 'tools/run_original_craft_emulator_probe.sh'
      - 'tools/test_original_craft_emulator_workflow.py'
      - 'tools/original_craft_probe_scenarios.py'
      - 'tools/test_original_craft_probe_scenarios.py'
      - 'tools/test_original_craft_probe_workflow_scenarios.py'
      - 'tools/original_craft_probe_state.py'
      - 'tools/test_original_craft_probe_state.py'
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Prior full run ID to resume from its uploaded evidence artifact'
        required: false
        type: string
        default: ''
      quick_scenario:
        description: 'Select one short independent check'
        required: true
        type: choice
        options: [project-create, hmi-palette, hmi-id17-properties]
        default: hmi-id17-properties
      profile:
        description: 'Quick scenario on PR; manually request full traversal here'
        required: true
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read
  actions: read

concurrency:
  # PR pushes may supersede a prior quick check; a manually launched full run
  # uses a different group and is never cancelled by subsequent code pushes.
  group: original-craft-emulator-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    # Reserve the six-hour budget for an explicitly requested full run only.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' && 360 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate resume request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        run: |
          if [ '${{ inputs.profile }}' != 'full' ]; then
            echo 'resume_run_id requires profile=full' >&2
            exit 2
          fi
      - name: Download prior full-run checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: Original-Craft-1.0.7-emulator-probe
          path: build-reports/original-craft-1.0.7/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Download the exact original Release APK
        run: |
          mkdir -p build
          curl --fail --location --retry 3 --retry-delay 2 "https://github.com/skynet909084-boop/BLOODSKY-Android/releases/download/kascada-analysis-1/KaScada.Smart.Craft.1.0.7.08.02.2026.apk" -o build/KaScada-Smart-Craft-1.0.7-release.apk
          echo "11464db76f59393ccf698f57e60af1756756ffc78cb315d43052ae92adb50d4f  build/KaScada-Smart-Craft-1.0.7-release.apk" | sha256sum --check -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install probe dependencies
        run: python -m pip install Pillow
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and traverse original UI offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            # Every PR push gets a bounded quick scenario, regardless of branch name.
            # Run a full audit explicitly from Actions > Run workflow > profile: full.
            bash tools/run_original_craft_emulator_probe.sh build-reports/original-craft-1.0.7 --scenario '${{ github.event_name == 'workflow_dispatch' && inputs.quick_scenario || 'hmi-id17-properties' }}' ${{ (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') && '--full' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '') && '--resume' || '' }}
      - name: Upload original APK provenance and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Original-Craft-1.0.7-emulator-probe
          path: build-reports/original-craft-1.0.7/
          if-no-files-found: warn
          retention-days: 7

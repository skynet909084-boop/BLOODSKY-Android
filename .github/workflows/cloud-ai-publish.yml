name: BLOODSKY publish validated AI draft

on:
  workflow_run:
    workflows: ['BLOODSKY anonymous free AI proof']
    types: [completed]

permissions:
  contents: read
concurrency:
  group: bloodsky-ai-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Privileged workflow_run must only execute trusted default-branch code.
      # Never checkout a proposal/source PR with this job's write token.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted source and unchanged validation inputs
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.path')
          test "$path" = '.github/workflows/cloud-ai-anonymous-proof.yml'
          if ! git merge-base --is-ancestor "$SOURCE_SHA" HEAD; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Source is not accepted on main; proposal stays an artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- app tools '*.gradle' gradle.properties settings.gradle AGENTS.md; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Validation inputs changed after inference; rerun the proof on main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.provenance.outputs.eligible == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: anonymous-ai-proposal
          path: ${{ runner.temp }}/validated-proposal
      - name: Verify evidence and revalidate the test-only proposal
        if: steps.provenance.outputs.eligible == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'validated-proposal'
          report = json.loads((root / 'report.json').read_text())
          assert report['mode'] == 'anonymous'
          assert report['live_inference_verified'] is True
          assert report['model_calls'] == 1
          assert report['router_source'] == '7ae0ef193d297c02479efed2a07946c44457512b'
          assert report['patch_sha256'] == hashlib.sha256((root / 'proposal.patch').read_bytes()).hexdigest()
          PY
          python3 tools/apply_cloud_proposal.py "$RUNNER_TEMP/validated-proposal/proposal.json"
      - name: Create one draft PR and explicitly dispatch independent CI
        if: steps.provenance.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: automation/cloud-agent-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Already published: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'BLOODSKY cloud pilot'
          git config user.email 'bloodsky-cloud@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- 'app/src/test/java/com/bloodsky/hmi/CloudAgent*Test.java'
          git commit -m 'test: add regression coverage generated by the free cloud agent'
          published_sha=$(git rev-parse HEAD)
          gh auth setup-git
          retained_sha=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [ -n "$retained_sha" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH"
            if ! git diff --quiet "$retained_sha" HEAD; then
              echo '::error::Existing proposal branch has a different tree; refusing to overwrite it.'
              exit 1
            fi
            published_sha=$retained_sha
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          cat > "$RUNNER_TEMP/ai-pr.md" <<EOF
          Adds only new JUnit regression tests generated through pinned FreeLLMAPI and anonymous OVH inference. Production Android code, UI and project format are unchanged.

          The proposal passed Python tests, Android unit tests, explicit proposed-class execution checks and debug APK build:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN

          Source commit: $SOURCE_SHA. Published commit: $published_sha.
          Independent APK/unit, emulator and preflight workflows are dispatched on this exact branch. All must succeed before human review/merge. No automatic merge, signing, physical-device or visual-parity claim.
          EOF
          if ! pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title 'test: free cloud-agent regression coverage' --body-file "$RUNNER_TEMP/ai-pr.md"); then
            echo '::error::Draft PR creation failed. Check Settings > Actions > General > Allow GitHub Actions to create and approve pull requests. No approval or merge is performed by this pilot.'
            echo "Validated branch retained: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Draft PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Published commit: $published_sha" >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN PR events may require approval. Explicit dispatches
          # run without a persistent PAT; they test the new branch, not main.
          gh workflow run android-apk.yml --ref "$BRANCH"
          gh workflow run android-ui-smoke.yml --ref "$BRANCH"
          gh workflow run cloud-ai-preflight.yml --ref "$BRANCH"
          echo 'Independent CI dispatched; draft remains pending human review.' >> "$GITHUB_STEP_SUMMARY"

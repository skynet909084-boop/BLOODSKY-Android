name: BLOODSKY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: bloodsky-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BLOODSKY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive inspector tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-test-reports-and-diagnostics
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BLOODSKY automated build"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Branch/ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "- APK: built (upload step must also succeed)"
              echo "- APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            else
              echo "- APK: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

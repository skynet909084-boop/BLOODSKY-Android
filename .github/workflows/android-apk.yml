name: BLOODSKY Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: bloodsky-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BLOODSKY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run archive inspector tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle original KaScada 1.0.7 widget images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kascada-decompiled app/src/main/res/drawable-nodpi
          gh api "repos/${{ github.repository }}/actions/artifacts/11912849123/zip" > /tmp/kascada-original.zip
          unzip -q /tmp/kascada-original.zip -d /tmp/kascada-decompiled
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path("/tmp/kascada-decompiled/apktool/res/drawable")
          target = Path("app/src/main/res/drawable-nodpi")
          # Import the complete original PNG drawable catalogue rather than
          # maintaining a tiny hand-picked subset. The 9-patch asset needs
          # separate compilation and is intentionally not renamed as a PNG.
          originals = sorted(
              p for p in source.glob("*.png") if not p.name.endswith(".9.png")
          )
          if len(originals) < 100:
              raise SystemExit(f"Unexpectedly small original resource library: {len(originals)}")
          for src in originals:
              shutil.copyfile(src, target / ("kc_" + src.name))
          print(f"Bundled {len(originals)} original KaScada drawable images")
          # Make every imported resource auditable and reproducible.
          import hashlib
          manifest = Path("app/src/main/res/original-kascada-assets.sha256")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(target.glob("kc_*.png"))
          ), encoding="utf-8")
          PY
          # Preserve ALL decoded resource directories and original app assets
          # as addressable runtime APK assets, including XML, fonts and audio.
          python3 tools/bundle_craft_resources.py /tmp/kascada-decompiled app
          python3 tools/catalogue_craft_resources.py app/src/main/assets/kascada_original /tmp/kascada-resource-catalogue.md
      - name: Upload original image resource bundle
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-KaScada-original-resource-library
          path: |
            app/src/main/res/drawable-nodpi/kc_*.png
            app/src/main/res/original-kascada-assets.sha256
            app/src/main/assets/kascada_original/**
            /tmp/kascada-resource-catalogue.md
          if-no-files-found: error
          retention-days: 30
      - name: Run Android unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-test-reports-and-diagnostics
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BLOODSKY automated build"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Branch/ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "- APK: built (upload step must also succeed)"
              echo "- APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            else
              echo "- APK: not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: BLOODSKY — декомпиляция APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег приватного Release, куда загружен APK (пусто = последний Release)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout BLOODSKY
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK from private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list --repo "$GH_REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Release не найден. Сначала создай Release и загрузи APK-файл."
            exit 1
          fi
          echo "Release tag: $TAG"
          mkdir -p input
          gh release download "$TAG" --repo "$GH_REPO" --pattern '*.apk' --dir input
          APK="$(find input -maxdepth 1 -type f -iname '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::В выбранном Release нет APK."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Download JADX
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '[.assets[] | select(.name | test("jadx.*\.zip$"; "i"))][0].browser_download_url // empty')"
          if [ -z "$URL" ]; then echo "::error::Не удалось найти ZIP релиза JADX"; exit 1; fi
          curl -fL "$URL" -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          echo "JADX_BIN=$(find /tmp/jadx -type f -name jadx | head -n 1)" >> "$GITHUB_ENV"
          chmod +x "$(find /tmp/jadx -type f -name jadx | head -n 1)"

      - name: Download Apktool
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '[.assets[] | select(.name | test("apktool.*\.jar$"; "i"))][0].browser_download_url // empty')"
          if [ -z "$URL" ]; then echo "::error::Не удалось найти JAR Apktool"; exit 1; fi
          curl -fL "$URL" -o /tmp/apktool.jar

      - name: Decompile Java-like source with JADX
        run: |
          mkdir -p output/jadx
          "$JADX_BIN" --show-bad-code -d output/jadx "$APK_PATH" 2>&1 | tee output/jadx.log
        continue-on-error: true

      - name: Decode resources and Smali with Apktool
        run: |
          java -jar /tmp/apktool.jar d -f "$APK_PATH" -o output/apktool 2>&1 | tee output/apktool.log
        continue-on-error: true

      - name: Build summary
        if: always()
        run: |
          mkdir -p output
          {
            echo "# BLOODSKY — отчёт декомпиляции"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo "## Количество файлов"
            echo "- JADX: $(find output/jadx -type f 2>/dev/null | wc -l)"
            echo "- Apktool: $(find output/apktool -type f 2>/dev/null | wc -l)"
            echo
            echo "См. журналы jadx.log и apktool.log. Декомпиляция может содержать ошибки."
          } > output/REPORT.md
          du -sh output || true

      - name: Upload analysis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Kaskada-decompiled
          path: output/
          retention-days: 7
          if-no-files-found: error

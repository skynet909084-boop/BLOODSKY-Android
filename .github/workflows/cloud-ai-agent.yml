name: BLOODSKY FreeLLMAPI agent

on:
  pull_request:
    paths:
      - '.github/workflows/cloud-ai-*.yml'
      - 'tools/*cloud*.py'
      - 'docs/FREELLMAPI_CLOUD_PILOT.md'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fixture, live]
        default: fixture
        description: 'fixture has no real inference; live requires a confirmed free-only Groq account'
      task:
        type: string
        default: 'Add focused regression tests for FbdPropertyEdits boundary values and invalid input.'
        description: 'One bounded test-only task (maximum 4000 characters)'
      publish:
        type: boolean
        default: false
        description: 'After validation, open a draft PR using BLOODSKY_AGENT_TOKEN'

permissions:
  contents: read
concurrency:
  group: bloodsky-free-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check explicit live configuration
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          CONFIRMED: ${{ vars.BLOODSKY_FREE_TIER_CONFIRMED }}
          FREE_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
          PUBLISH: ${{ inputs.publish }}
          PR_TOKEN: ${{ secrets.BLOODSKY_AGENT_TOKEN }}
        run: |
          test "$CONFIRMED" = true || { echo '::error::Confirm a free-only Groq account without billing first.'; exit 1; }
          test -n "$FREE_KEY" || { echo '::error::GROQ_FREE_API_KEY is missing.'; exit 1; }
          if [ "$PUBLISH" = true ]; then
            test -n "$PR_TOKEN" || { echo '::error::BLOODSKY_AGENT_TOKEN is required to trigger independent PR CI.'; exit 1; }
          fi
      - name: Checkout immutable FreeLLMAPI v0.15.0 source
        uses: actions/checkout@v4
        with:
          repository: tashfeenahmed/freellmapi
          ref: 7ae0ef193d297c02479efed2a07946c44457512b
          path: .cloud-upstream
          persist-credentials: false
      - name: Build pinned router without provider credentials
        run: docker build --build-arg FREELLMAPI_COMMIT_SHA=7ae0ef193d297c02479efed2a07946c44457512b -t bloodsky-freellmapi:pilot .cloud-upstream
      - name: Exercise real router with isolated fixture provider
        if: github.event_name == 'pull_request' || inputs.mode != 'live'
        run: python3 tools/run_cloud_router.py --mode fixture --context app/src/main/java/com/bloodsky/hmi/FbdPropertyEdits.java
      - name: Generate tests through a confirmed free-only provider
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
        env:
          GROQ_FREE_API_KEY: ${{ secrets.GROQ_FREE_API_KEY }}
          BLOODSKY_FREE_TIER_CONFIRMED: ${{ vars.BLOODSKY_FREE_TIER_CONFIRMED }}
          TASK: ${{ inputs.task }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "cloud-task.txt").write_text(os.environ["TASK"], encoding="utf-8")'
          python3 tools/run_cloud_router.py --mode live --task-file "$RUNNER_TEMP/cloud-task.txt" --context app/src/main/java/com/bloodsky/hmi/FbdPropertyEdits.java app/src/test/java/com/bloodsky/hmi/FbdPropertyEditsTest.java
      - name: Save only sanitized proposal files
        uses: actions/upload-artifact@v4
        with:
          name: cloud-agent-proposal
          path: |
            cloud-output/proposal.json
            cloud-output/proposal.patch
            cloud-output/report.json
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cloud-agent-proposal
          path: ${{ runner.temp }}/cloud-proposal
      - name: Independently validate and apply the proposed new tests
        run: python3 tools/apply_cloud_proposal.py "$RUNNER_TEMP/cloud-proposal/proposal.json"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare pinned original resources
        run: python3 tools/prepare_craft_resources.py
      - name: Python regression suite
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Android unit tests including the proposed tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK with the proposed tests
        run: gradle assembleDebug --stacktrace
      - name: Retain independent validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-agent-validation
          path: |
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Record exact validation evidence
        if: always()
        env:
          MODE: ${{ inputs.mode || 'fixture' }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo '## FreeLLMAPI bounded coding pilot'
            echo "- Mode: $MODE (fixture does not prove real inference)"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Independent Python / Android tests and APK: $RESULT"
            echo '- UI remains gated by the existing emulator PR workflow.'
            echo '- No automatic merge or release signing.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-draft:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cloud-agent-proposal
          path: ${{ runner.temp }}/cloud-proposal
      - run: python3 tools/apply_cloud_proposal.py "$RUNNER_TEMP/cloud-proposal/proposal.json"
      - name: Publish one isolated branch and draft pull request
        env:
          GH_TOKEN: ${{ secrets.BLOODSKY_AGENT_TOKEN }}
          BRANCH: automation/cloud-agent-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'BLOODSKY cloud pilot'
          git config user.email 'bloodsky-cloud@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- 'app/src/test/java/com/bloodsky/hmi/CloudAgent*Test.java'
          git commit -m 'test: add bounded cloud-agent regression coverage'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/cloud-pr.md" <<EOF
          Adds new JUnit regression tests only; production UI and project format are unchanged.

          Validation: Python suite, Android unit tests and debug APK passed in
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID .

          Independent PR CI and emulator smoke must finish successfully before human review/merge.
          No physical-device or original visual-parity comparison was performed by this agent.
          EOF
          gh pr create --draft --base main --head "$BRANCH" --title 'test: cloud-agent regression coverage' --body-file "$RUNNER_TEMP/cloud-pr.md"

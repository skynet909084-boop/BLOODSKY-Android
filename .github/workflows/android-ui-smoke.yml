name: BLOODSKY Android UI smoke

on:
  workflow_dispatch:
    inputs:
      ui_profile:
        description: "Run all UI regressions (full) or focused FBD gate (quick)"
        required: true
        type: choice
        default: full
        options: [full, quick]
      api_level:
        description: "Android API image (31 is Android 12)"
        required: true
        type: choice
        default: '30'
        options: ['30', '31', '32']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'app/**'
      - 'tools/android_ui_smoke.py'
      - 'tools/android_ui_fbd_quick.py'
      - 'tools/build_ui_input_driver.py'
      - 'tools/run_android_ui_profile.sh'
      - 'tools/prepare_craft_resources.py'
      - 'tools/android/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/android_ui_smoke.py'
      - 'tools/android_ui_fbd_quick.py'
      - 'tools/build_ui_input_driver.py'
      - 'tools/run_android_ui_profile.sh'
      - 'tools/prepare_craft_resources.py'
      - 'tools/android/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-ui-smoke.yml'

permissions:
  contents: read

concurrency:
  group: bloodsky-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    # Run the full emulator gate for the integration PR and stable-main PRs.
    # Other intermediate feature PRs keep the quick profile on demand.
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'feat/craft-project-json-import-20261018' || github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Other feature→feature PRs use fast FBD verification; integration/main PRs,
    # push→main and manually dispatched default runs use the full UI suite.
    env:
      BLOODSKY_UI_PROFILE: ${{ github.event_name == 'pull_request' && !contains(github.head_ref, 'android12') && !startsWith(github.head_ref, 'fix/document-picker-') && github.base_ref != 'main' && github.base_ref != 'feat/craft-project-json-import-20261018' && 'quick' || (github.event_name == 'workflow_dispatch' && inputs.ui_profile == 'quick' && 'quick' || 'full') }}
      BLOODSKY_ANDROID_API: ${{ github.event_name == 'workflow_dispatch' && inputs.api_level || (contains(github.head_ref, 'android12') && '31' || '30') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned original resources
        run: python tools/prepare_craft_resources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace
          python tools/build_ui_input_driver.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise APK on Android ${{ env.BLOODSKY_ANDROID_API }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ env.BLOODSKY_ANDROID_API }}
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # The emulator action runs the script as a single /bin/sh command.
          # A multiline if/fi passed directly as input is split by that action.
          script: bash tools/run_android_ui_profile.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Record UI gate and selection
        if: always()
        run: |
          {
            echo "## BLOODSKY Android UI"
            echo "- Profile: $BLOODSKY_UI_PROFILE"
            echo "- Android API: $BLOODSKY_ANDROID_API"
            echo "- Commit: $GITHUB_SHA"
            echo "- To run full on Android 12: Actions → BLOODSKY Android UI smoke → Run workflow → ui_profile=full, api_level=31"
            echo "- PRs targeting main always use full"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Android-UI-smoke
          path: build-reports/android-ui-smoke/
          if-no-files-found: warn
          retention-days: 14

name: BLOODSKY Android UI smoke

on:
  workflow_dispatch:
    inputs:
      ui_profile:
        description: "Release acceptance: quick FBD smoke or full Android UI regression"
        required: true
        type: choice
        default: full
        options: [full, quick]
  # Only release-candidate PRs targeting stable main start Android automatically.
  # Routine implementation PRs defer emulator/device acceptance until release.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    paths:
      - 'app/**'
      - 'tools/android_ui_smoke.py'
      - 'tools/android_ui_fbd_quick.py'
      - 'tools/build_ui_input_driver.py'
      - 'tools/run_android_ui_profile.sh'
      - 'tools/prepare_craft_resources.py'
      - 'tools/android/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-ui-smoke.yml'
permissions:
  contents: read

concurrency:
  group: bloodsky-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    # Manual dispatch remains available; PR automation requires an explicit
    # release-candidate label so ordinary parity work never boots Android.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BLOODSKY_UI_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_profile == 'quick' && 'quick' || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned original resources
        run: python tools/prepare_craft_resources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace
          python tools/build_ui_input_driver.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise APK on Android 11
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # The emulator action runs the script as a single /bin/sh command.
          # A multiline if/fi passed directly as input is split by that action.
          script: bash tools/run_android_ui_profile.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Record UI gate and selection
        if: always()
        run: |
          {
            echo "## BLOODSKY Android UI"
            echo "- Profile: $BLOODSKY_UI_PROFILE"
            echo "- Commit: $GITHUB_SHA"
            echo "- Routine implementation PRs do NOT automatically boot Android"
            echo "- Release-candidate PRs targeting main run full only when labeled release-candidate"
            echo "- Manual quick/full profiles remain available: Actions → BLOODSKY Android UI smoke → Run workflow → choose ui_profile"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Android-UI-smoke
          path: build-reports/android-ui-smoke/
          if-no-files-found: warn
          retention-days: 14

name: BLOODSKY Android UI smoke

on:
  workflow_dispatch:
    inputs:
      ui_profile:
        description: "Run all UI regressions (full) or focused FBD gate (quick)"
        required: true
        type: choice
        default: full
        options: [full, quick]
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/android-ui-smoke.yml'

permissions:
  contents: read

concurrency:
  group: bloodsky-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Feature→feature PRs get fast FBD verification; PR→main, push→main
    # and manually dispatched default runs retain every legacy UI scenario.
    env:
      BLOODSKY_UI_PROFILE: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'fix/document-picker-') && github.base_ref != 'main' && 'quick' || (github.event_name == 'workflow_dispatch' && inputs.ui_profile == 'quick' && 'quick' || 'full') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned original resources
        run: python tools/prepare_craft_resources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace
          python tools/build_ui_input_driver.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise APK on Android 11
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # The emulator action runs the script as a single /bin/sh command.
          # A multiline if/fi passed directly as input is split by that action.
          script: bash tools/run_android_ui_profile.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Record UI gate and selection
        if: always()
        run: |
          {
            echo "## BLOODSKY Android UI"
            echo "- Profile: $BLOODSKY_UI_PROFILE"
            echo "- Commit: $GITHUB_SHA"
            echo "- To run full on a feature branch: Actions → BLOODSKY Android UI smoke → Run workflow → ui_profile=full"
            echo "- PRs targeting main always use full"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOODSKY-Android-UI-smoke
          path: build-reports/android-ui-smoke/
          if-no-files-found: warn
          retention-days: 14

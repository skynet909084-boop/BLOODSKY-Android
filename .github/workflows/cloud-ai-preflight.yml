name: BLOODSKY Cloud AI Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloodsky-cloud-ai-preflight
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate cloud pilot configuration without credentials
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/FREELLMAPI_CLOUD_PILOT.md
          test -f settings.gradle
          python3 - <<'PY'
          from pathlib import Path
          doc = Path('docs/FREELLMAPI_CLOUD_PILOT.md').read_text()
          for required in ('GitHub Actions', 'FreeLLMAPI', 'pull request', 'secrets'):
              assert required.lower() in doc.lower(), required
          print('Cloud AI pilot preflight passed (no provider calls made)')
          PY
      - name: Summary
        run: |
          echo '### BLOODSKY cloud pilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preflight only: no agent, provider API calls, or code writes.' >> "$GITHUB_STEP_SUMMARY"
